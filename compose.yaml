services:
  accelerator:
    image: ghcr.io/cloudcranes/web-proxy:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "20516:20516"
      - "4443:4443"
    volumes:
      - blob-cache:/data
      # Pull-as-a-service: the gateway asks the local daemon to pull images
      # through it. DOCKER_GID must be the host docker group gid
      # (`stat -c %g /var/run/docker.sock`).
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-999}"
    # Chunk fetches resolve upstream mirror hostnames; flaky LAN router DNS
    # kills whole downloads, so pin dependable public resolvers.
    dns:
      - 223.5.5.5
      - 119.29.29.29
    env_file:
      - .env
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    cpus: "2.0"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  blob-cache:
