name: build

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long
            type=raw,value=latest
          flavor: |
            latest=auto

      - name: Build (and push on non-PR)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Compile-check + lint (fail fast, surfaces errors in step summary)
        if: github.event_name != 'pull_request'
        id: lint
        run: |
          set +e
          rustup component add rustfmt >/dev/null 2>&1 || true
          cargo fmt --all -- --check > fmt.log 2>&1
          FMT=$?
          cargo check --locked --message-format=short --color=never > check.log 2>&1
          CHECK=$?
          if [ $FMT -ne 0 ]; then
            {
              echo "### cargo fmt --check failed"
              echo '```'
              cat fmt.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ $CHECK -ne 0 ]; then
            {
              echo "### cargo check --locked failed"
              echo '```'
              head -200 check.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          exit 0
